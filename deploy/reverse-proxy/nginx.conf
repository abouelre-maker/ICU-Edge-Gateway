# =============================================================================
# TLS termination in front of the ICU Edge Gateway (F-09/10, HD-E5)
#
# The gateway process speaks plain HTTP/WebSocket on 127.0.0.1:8000 and plain
# MLLP on 127.0.0.1:2575. Everything that leaves the host goes through this
# proxy:
#   443  HTTPS + WSS  -> 127.0.0.1:8000   (REST API, /health, live WebSocket)
#   2576 MLLP over mutual TLS -> 127.0.0.1:2575
# Bind the gateway to loopback (uvicorn --host 127.0.0.1, MLLP_HOST=127.0.0.1)
# so the proxy is the only way in.
#
# Deliberately NO plain-HTTP listener on port 80: a redirect would only come
# after a client has already sent its API key and clinical payload in clear.
# Clients must be configured with https:// URLs.
#
# Files you provide in /etc/nginx/tls/:
#   gateway.crt, gateway.key  server certificate (hospital PKI or ACME)
#   monitor-ca.crt            CA that issued the monitors' / interface
#                             engines' client certificates (MLLP mutual TLS)
#
# Validated in CI with `nginx -t` (.github/workflows/ci.yml).
# =============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;

    # Log the path only ($uri), never the query string: the live WebSocket
    # accepts its API key as ?access_token=..., which must not reach the logs.
    log_format no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log no_query;

    # Live WebSocket: use ?access_token=... when present, otherwise keep the
    # client's own Authorization header.
    map $arg_access_token $live_authorization {
        ""      $http_authorization;
        default "Bearer $arg_access_token";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/gateway.crt;
        ssl_certificate_key /etc/nginx/tls/gateway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # Same as the gateway's default MAX_REQUEST_BODY_BYTES (256 KiB, F-02):
        # larger bodies are refused here instead of being buffered first.
        # If you raise MAX_REQUEST_BODY_BYTES, raise this to the same value.
        client_max_body_size 256k;

        location /api/v1/live/ {
            # Browsers can only send the WebSocket key as ?access_token=...
            # Move it into the Authorization header and drop the query string,
            # so the key never appears in the upstream request line or in any
            # upstream log; the error log here only records critical events.
            error_log /var/log/nginx/error.log crit;
            # Capture BEFORE clearing $args ($arg_* is read from $args).
            set $live_auth_value $live_authorization;
            set $args "";
            proxy_set_header Authorization $live_auth_value;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}

stream {
    server {
        listen 2576 ssl;
        proxy_pass 127.0.0.1:2575;

        ssl_certificate     /etc/nginx/tls/gateway.crt;
        ssl_certificate_key /etc/nginx/tls/gateway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Mutual TLS is REQUIRED: behind this proxy every MLLP peer reaches the
        # gateway from 127.0.0.1, so the gateway's MLLP_ALLOWED_CLIENTS can no
        # longer tell devices apart. Only a client certificate issued by the
        # monitor CA gets through.
        ssl_client_certificate /etc/nginx/tls/monitor-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        proxy_timeout 300s;
    }
}

# =============================================================================
# TLS termination in front of the ICU Edge Gateway (F-09/10, HD-E5)
#
# The gateway process speaks plain HTTP/WebSocket on 127.0.0.1:8000 and plain
# MLLP on 127.0.0.1:2575. Everything that leaves the host goes through this
# proxy:
#   443  HTTPS + WSS  -> 127.0.0.1:8000   (REST API, /health, live WebSocket)
#   2576 MLLP over TLS -> 127.0.0.1:2575  (monitors / interface engines that
#                                          support TLS-wrapped MLLP)
# Bind the gateway to loopback (uvicorn --host 127.0.0.1, MLLP_HOST=127.0.0.1)
# so the proxy is the only way in.
#
# Replace the certificate paths with your own (hospital PKI or ACME).
# Validated in CI with `nginx -t` (.github/workflows/ci.yml).
# =============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/gateway.crt;
        ssl_certificate_key /etc/nginx/tls/gateway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # Matches the gateway's own body cap (F-02); larger requests stop here.
        client_max_body_size 1m;

        location /api/v1/live/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}

stream {
    server {
        listen 2576 ssl;
        proxy_pass 127.0.0.1:2575;

        ssl_certificate     /etc/nginx/tls/gateway.crt;
        ssl_certificate_key /etc/nginx/tls/gateway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Optional mutual TLS: accept only monitors with a hospital-issued
        # client certificate.
        # ssl_client_certificate /etc/nginx/tls/monitor-ca.crt;
        # ssl_verify_client on;

        proxy_timeout 300s;
    }
}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icu-edge-gateway"
version = "1.0.0"
description = "Research gateway: HL7 v2 to FHIR R4 for ICU vital signs, with NEWS2 scoring and artifact rejection"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Housam Abouelreish" }]
keywords = ["fhir", "hl7", "news2", "icu", "biomedical-signal-processing", "samd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "structlog",
]

[project.urls]
Repository = "https://github.com/abouelre-maker/ICU-Edge-Gateway"
Issues = "https://github.com/abouelre-maker/ICU-Edge-Gateway/issues"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long - handled by ruff format
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
# Zero-risk config: third-party libs without stubs are not re-analyzed.
ignore_missing_imports = true

# structlog's BoundLogger dynamically exposes .info()/.warning() at runtime;
# the static stubs for BoundLoggerBase do not declare them. Silenced per-module
# at usage sites only — no code changes, no logic impact.
[[tool.mypy.overrides]]
module = [
  "api.v1.vitals",
  "api.v1.ingest",
  "domain.services.vitals_orchestrator",
  "infrastructure.adapters.hl7v2_adapter",
  "infrastructure.streaming.mllp_listener",
  "infrastructure.streaming.subscription_dispatcher",
  "api.v1.fhir_subscription",
]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

# =============================================================================
# CI/CD — ICU Edge-to-FHIR Interoperability Gateway
# IEC 62304 §5.7: Automated verification gate for every push and PR.
# Quality Gate: Ruff → Mypy → Bandit → pip-audit → pytest → Docker
# =============================================================================

name: CI — ICU Edge-to-FHIR Gateway

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger for release validation

env:
  PYTHON_VERSION: "3.11"
  MIN_COVERAGE:   "90"
  MAX_IMAGE_MB:   "400"
  PYTHONPATH: "."
  
jobs:
  # ─── Job 1: Static Analysis & Test Suite ─────────────────────────────────────
  quality-gate:
    name: Quality Gate (Ruff → Mypy → Bandit → pip-audit → pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install production and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ── Step 1: Ruff Lint ────────────────────────────────────────────────────
      - name: "Ruff — lint (IEC 62304 §5.5 code quality)"
        run: ruff check src/ tests/

      # ── Step 2: Mypy Type Check ──────────────────────────────────────────────
      - name: "Mypy — strict type checking"
        run: mypy src/

      # ── Step 3: Bandit SAST ──────────────────────────────────────────────────
      - name: "Bandit — static application security testing (IEC 81001-5-1)"
        run: bandit --recursive src/ --severity-level low --quiet

      # ── Step 4: pip-audit Dependency Vulnerability Scan ─────────────────────
      - name: "pip-audit — dependency CVE scan"
        run: pip-audit --requirement requirements.txt --progress-spinner off

      # ── Step 5: pytest with Coverage ─────────────────────────────────────────
      - name: "pytest — full test suite (${{ env.MIN_COVERAGE }}% coverage gate)"
        run: |
          pytest \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.MIN_COVERAGE }} \
            --tb=long \
            -v

      # ── Step 6: Upload Coverage (informational) ──────────────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: ${{ !cancelled() }}
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ─── Job 2: Docker Build, Size Check & Smoke Test ────────────────────────────
  docker-build:
    name: Docker Build — Alpine 3.23, Edge-Optimized (size-limited)
    runs-on: ubuntu-latest
    needs: quality-gate  # Only run if quality gate passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runtime stage image
        run: |
          docker build \
            --target runtime \
            --tag icu-edge-fhir-gateway:ci \
            --file Dockerfile \
            .

      # ── Size Enforcement ──────────────────────────────────────────────────────
      - name: Verify image size < ${{ env.MAX_IMAGE_MB }} MB
        run: |
          SIZE_BYTES=$(docker image inspect icu-edge-fhir-gateway:ci --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          MAX_MB=${{ env.MAX_IMAGE_MB }}
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Image size : ${SIZE_MB} MB"
          echo "  Size limit : ${MAX_MB} MB"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "${SIZE_MB}" -gt "${MAX_MB}" ]; then
            echo "ERROR: Image (${SIZE_MB} MB) exceeds the ${MAX_MB} MB edge limit."
            exit 1
          fi
          echo "PASSED: Image is within edge deployment size limit."

      # ── Smoke Test — Health Endpoint ──────────────────────────────────────────
      - name: Smoke test — GET /health returns status 'healthy'
        run: |
          # F-01 / A2: the gateway refuses to start without an API key and
          # the NEWS2 staleness windows. Synthetic smoke test: random key,
          # TEST-HARNESS staleness value (same as tests/conftest.py), not a
          # clinical value (HD-E7 open).
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$key"
          stale=""
          for t in RESPIRATORY_RATE SPO2 SUPPLEMENTAL_O2 SYSTOLIC_BP HEART_RATE CONSCIOUSNESS TEMPERATURE_CELSIUS; do
            stale="$stale -e NEWS2_STALENESS_WINDOW_${t}_SECONDS=315360000"
          done
          # shellcheck disable=SC2086
          docker run \
            --detach \
            --name gateway-smoke \
            --publish 8000:8000 \
            -e GATEWAY_API_KEYS="$key" $stale \
            icu-edge-fhir-gateway:ci

          # Wait for application startup (scipy imports take a moment on first run)
          echo "Waiting for gateway startup..."
          for i in $(seq 1 20); do
            if curl --silent --fail http://localhost:8000/health > /dev/null 2>&1; then
              echo "Gateway is up after ${i}s"
              break
            fi
            sleep 1
          done

          # Validate health response
          curl --fail --silent http://localhost:8000/health | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assert data['status'] == 'healthy', \
            f\"Expected status='healthy', got {data['status']!r}\"
          assert data['version'] == '1.0.0', \
            f\"Expected version='1.0.0', got {data['version']!r}\"
          assert data['uptime_seconds'] >= 0, \
            f\"uptime_seconds must be non-negative, got {data['uptime_seconds']}\"
          print(f\"Smoke test PASSED: status={data['status']}, \
          version={data['version']}, \
          uptime={data['uptime_seconds']}s\")
          "

          docker stop gateway-smoke

      # ── Container Security Scan (Trivy) ───────────────────────────────────────
      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: icu-edge-fhir-gateway:ci
          format: table
          exit-code: "1"       # S-06: fixable HIGH/CRITICAL findings fail the build
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # ── SBOM (S-06) ───────────────────────────────────────────────────────────
      - name: Generate CycloneDX SBOM of the image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: icu-edge-fhir-gateway:ci
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn

  # ─── Job 3: TLS reverse-proxy configuration check (F-09/10) ─────────────────
  reverse-proxy-config:
    name: TLS reverse-proxy config (nginx -t)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate deploy/reverse-proxy/nginx.conf with a throwaway certificate
        run: |
          mkdir -p tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci" \
            -keyout tls/gateway.key -out tls/gateway.crt
          docker run --rm \
            -v "$PWD/deploy/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/tls:/etc/nginx/tls:ro" \
            nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de \
            nginx -t

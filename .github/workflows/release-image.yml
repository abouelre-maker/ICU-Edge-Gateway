# =============================================================================
# Release image: build, sign, attest SBOM, THEN publish tags (S-06)
#
# Runs only on pushes to main and on v* tags (no manual dispatch, so an
# unreviewed branch can never be published). The image is first pushed under
# an immutable sha-<commit> tag, signed and SBOM-attested with keyless cosign,
# and verified against THIS workflow's identity; only then do the moving tags
# (main / vX.Y.Z) point at it. A failed signing step therefore never leaves a
# moving tag on an unsigned image.
#
# Verify (pin the digest you will run):
#   cosign verify ghcr.io/abouelre-maker/icu-edge-gateway@sha256:<digest> \
#     --certificate-identity-regexp '^https://github.com/abouelre-maker/ICU-Edge-Gateway/\.github/workflows/release-image\.yml@refs/(heads/main|tags/v.+)$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# =============================================================================
name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# One publication per ref at a time, in commit order: a newer push waits for
# the running one, and an older queued run is superseded by the newer one, so
# an older build can never move the tag after a newer one.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign, attest and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/icu-edge-gateway
      IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/release-image\.yml@refs/(heads/main|tags/v.+)$
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable tag only)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Research software, not a medical device. HL7 v2 to FHIR R4 edge gateway.

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image and attest SBOM (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

      - name: Verify signature against this workflow's exact identity
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          cosign verify-attestation "$REF" --type cyclonedx \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null

      - name: Publish moving tag (only after signing succeeded)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          docker buildx imagetools create --tag "${IMAGE}:${tag}" "$REF"
          {
            echo "### Published"
            echo "- Image: \`${IMAGE}:${tag}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\` (pin this)"
          } >> "$GITHUB_STEP_SUMMARY"
